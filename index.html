<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storage System</title>

    <link rel="stylesheet" href="./styles/style.css" />
    <script src="https://kit.fontawesome.com/a98cfb7b7f.js" crossorigin="anonymous"></script>
</head>
<body>
    <main class="storage-container">
        <h1 class="storage-header">Storage</h1>
        <div class="grid-header">
            <b>My files</b>
            <div class="search-container">
                <input class="search-input" placeholder="Filter by name">
                <button class="search-icon" type="button">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <button class="add-button">
                    <i class="fa-solid fa-plus plus-sign"></i>
                    Add new
            </button>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="checkbox-tr">
                            <input class="checkbox" type="checkbox">
                        </th>
                        <th>Name</th>
                        <th>Uploaded Date</th>
                        <th>Sharing</th>
                        <th>Size</th>
                        <th class="action-th">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="table-row">
                        <td class="checkbox-tr">
                            <input class="checkbox" type="checkbox">
                        </td>
                        <td>Folder name</td>
                        <td>Jun 19, 2026</td>
                        <td>Private</td>
                        <td>--</td>
                        <td class="action-td">
                            <div class="dropdown-btn">
                                <button class="action-button" type="button">
                                    <i class="fa-solid fa-ellipsis-vertical"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="pagination-container">
            <ul>
                <li>
                    <button class="btn-pagination left-forward" type="button" disabled>
                    </button>
                </li>
                <li>
                    <button class="btn-pagination left-arrow" type="button">
                    </button>
                </li>
                <li class="page-number">
                    <b>1</b> of 1
                </li>
                <li>
                    <button class="btn-pagination right-arrow" type="button">
                    </button>
                </li>
                <li>
                    <button class="btn-pagination right-forward" type="button">
                    </button>
                </li>
            </ul>
        </div>
    </main>
</body>
</html>
