<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storage System</title>

    <link rel="stylesheet" href="./styles/style.css" />
    <script src="https://kit.fontawesome.com/a98cfb7b7f.js" crossorigin="anonymous"></script>
</head>
<body>
    <main class="storage-container">
        <h1 class="storage-header">Storage</h1>
        <div class="grid-header">
            <b>My files</b>
            <div class="search-container">
                <input class="search-input" placeholder="Filter by name">
                <button class="search-icon" type="button">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <button class="add-button" id="add-button">
                    <i class="fa-solid fa-plus plus-sign"></i>
                    Add new
            </button>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="checkbox-tr">
                            <input class="checkbox" type="checkbox">
                        </th>
                        <th>Name</th>
                        <th>Uploaded Date</th>
                        <th>Size</th>
                        <th class="action-th">Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>
        <div class="pagination-container">
            <ul>
                <li>
                    <button class="btn-pagination" type="button" disabled>
                        <svg width="13" height="12" viewBox="0 0 13 12" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12.2924 9.89L8.21595 6L12.3029 2.11C12.7127 1.72 12.7127 1.09 12.3029 0.7C11.8932 0.31 11.2313 0.31 10.8215 0.7L5.99911 5.29C5.58937 5.68 5.58937 6.31 5.99911 6.7L10.8215 11.29C11.2313 11.68 11.8932 11.68 12.3029 11.29C12.7022 10.91 12.7022 10.27 12.2924 9.89V9.89ZM1.05063 0C1.62848 0 2.10127 0.45 2.10127 1V11C2.10127 11.55 1.62848 12 1.05063 12C0.472785 12 0 11.55 0 11V1C0 0.45 0.472785 0 1.05063 0Z"/>
                        </svg>
                    </button>
                </li>
                <li>
                    <button class="btn-pagination" type="button" disabled>
                        <svg width="7" height="12" viewBox="0 0 7 12" xmlns="http://www.w3.org/2000/svg">
                            <path d="M6.61111 0.2925C6.20136 -0.0975 5.53946 -0.0975 5.12971 0.2925L0.30731 4.8825C-0.102437 5.2725 -0.102437 5.9025 0.30731 6.2925L5.12971 10.8825C5.53946 11.2725 6.20136 11.2725 6.61111 10.8825C7.02085 10.4925 7.02085 9.8625 6.61111 9.4725L2.53465 5.5825L6.61111 1.7025C7.02085 1.3125 7.01035 0.6725 6.61111 0.2925V0.2925Z"/>
                        </svg>
                    </button>
                </li>
                <li class="page-number">
                    <b>1</b> of 1
                </li>
                <li>
                    <button class="btn-pagination" type="button" disabled>
                        <svg width="7" height="12" viewBox="0 0 7 12" xmlns="http://www.w3.org/2000/svg">
                            <path d="M0.30731 0.293762C-0.102437 0.683762 -0.102437 1.31376 0.30731 1.70376L4.38377 5.58376L0.30731 9.46376C-0.102437 9.85376 -0.102437 10.4838 0.30731 10.8738C0.717057 11.2638 1.37896 11.2638 1.7887 10.8738L6.61111 6.28376C7.02085 5.89376 7.02085 5.26376 6.61111 4.87376L1.7887 0.283762C1.38946 -0.0962379 0.717057 -0.0962377 0.30731 0.293762Z"/>
                        </svg>
                    </button>
                </li>
                <li>
                    <button class="btn-pagination" type="button" disabled>
                        <svg width="13" height="12" viewBox="0 0 13 12" xmlns="http://www.w3.org/2000/svg">
                            <path d="M0.30731 2.11L4.39427 6L0.30731 9.89C-0.102437 10.28 -0.102437 10.91 0.30731 11.3C0.717057 11.69 1.37896 11.69 1.7887 11.3L6.61111 6.71C7.02085 6.32 7.02085 5.69 6.61111 5.3L1.7887 0.7C1.37896 0.31 0.717057 0.31 0.30731 0.7C-0.0919304 1.09 -0.0919304 1.73 0.30731 2.11ZM11.5596 0C12.1374 0 12.6102 0.45 12.6102 1V11C12.6102 11.55 12.1374 12 11.5596 12C10.9817 12 10.509 11.55 10.509 11V1C10.509 0.45 10.9817 0 11.5596 0Z"/>
                        </svg>
                    </button>
                </li>
            </ul>
        </div>
    </main>
    <script type='module' src="scripts/script.js"></script>
    <div id="overlay"></div>
</body>
</html>
